<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My PDFs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 12px;
            margin: 4px;
            cursor: pointer;
        }

        li {
            margin: 15px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .pdf-name {
            display: block;
            margin-bottom: 8px;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>My PDF Store</h1>

    <input type="file" id="pdfInput" accept="application/pdf">
    <button onclick="savePDF()">Add PDF</button>

    <h2>My PDFs</h2>

    <ul id="pdfList"></ul>

    <script>
        let db;

        const request = indexedDB.open("PDFStore", 1);

        request.onupgradeneeded = function(event) {
            db = event.target.result;

            if (!db.objectStoreNames.contains("pdfs")) {
                db.createObjectStore("pdfs", {
                    keyPath: "id",
                    autoIncrement: true
                });
            }
        };

        request.onsuccess = function(event) {
            db = event.target.result;
            showPDFs();
        };

        request.onerror = function() {
            alert("PDF storage open nahi ho paaya.");
        };

        function savePDF() {
            const input = document.getElementById("pdfInput");

            if (input.files.length === 0) {
                alert("Pehle PDF select kar bhai.");
                return;
            }

            const file = input.files[0];

            const transaction = db.transaction(["pdfs"], "readwrite");
            const store = transaction.objectStore("pdfs");

            store.add({
                name: file.name,
                file: file
            });

            transaction.oncomplete = function() {
                input.value = "";
                showPDFs();
            };

            transaction.onerror = function() {
                alert("PDF save nahi ho paayi.");
            };
        }

        function showPDFs() {
            const list = document.getElementById("pdfList");
            list.innerHTML = "";

            const transaction = db.transaction(["pdfs"], "readonly");
            const store = transaction.objectStore("pdfs");

            store.openCursor().onsuccess = function(event) {
                const cursor = event.target.result;

                if (cursor) {
                    const pdf = cursor.value;

                    const li = document.createElement("li");

                    const name = document.createElement("span");
                    name.className = "pdf-name";
                    name.textContent = pdf.name;

                    const openButton = document.createElement("button");
                    openButton.textContent = "Open PDF";

                    openButton.onclick = function() {
                        const url = URL.createObjectURL(pdf.file);

                        // Mobile aur PC dono ke liye direct navigation
                        window.location.href = url;
                    };

                    const downloadButton = document.createElement("button");
                    downloadButton.textContent = "Download";

                    downloadButton.onclick = function() {
                        const url = URL.createObjectURL(pdf.file);

                        const a = document.createElement("a");
                        a.href = url;
                        a.download = pdf.name;

                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);

                        setTimeout(function() {
                            URL.revokeObjectURL(url);
                        }, 1000);
                    };

                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "Delete";

                    deleteButton.onclick = function() {
                        deletePDF(pdf.id);
                    };

                    li.appendChild(name);
                    li.appendChild(openButton);
                    li.appendChild(downloadButton);
                    li.appendChild(deleteButton);

                    list.appendChild(li);

                    cursor.continue();
                }
            };
        }

        function deletePDF(id) {
            const transaction = db.transaction(["pdfs"], "readwrite");
            const store = transaction.objectStore("pdfs");

            store.delete(id);

            transaction.oncomplete = function() {
                showPDFs();
            };
        }
    </script>

</body>
</html>
